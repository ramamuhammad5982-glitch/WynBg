name: Build WynBG Jar

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Plugin
        run: |
          for z in *.zip; do
            [ -f "$z" ] && unzip -o "$z" -d extracted_wynbg
          done

          BUILD_FILE=$(find . -maxdepth 4 -name "build.gradle" | head -n 1)
          if [ -n "$BUILD_FILE" ]; then
            cd "$(dirname "$BUILD_FILE")"
            gradle build
            exit 0
          fi

          JAVA_FILE=$(find . -maxdepth 4 -name "WynBGPlugin.java" | head -n 1)
          if [ -z "$JAVA_FILE" ]; then
            echo "ERROR: File WynBGPlugin.java belum ada di repositori! Silakan upload WynBGPlugin.java di tab Code."
            exit 1
          fi

          mkdir -p src/main/java/id/wynbg src/main/resources
          cp "$JAVA_FILE" src/main/java/id/wynbg/WynBGPlugin.java

          cat << 'EOF' > settings.gradle
          rootProject.name = 'WynBG'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'java'
          }
          group = 'id.wynbg'
          version = '1.0.0'
          java {
              toolchain {
                  languageVersion = JavaLanguageVersion.of(21)
              }
          }
          repositories {
              mavenCentral()
              maven { url = 'https://repo.papermc.io/repository/maven-public/' }
          }
          dependencies {
              compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
          }
          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }
          EOF

          cat << 'EOF' > src/main/resources/plugin.yml
          name: WynBG
          version: 1.0.0
          main: id.wynbg.WynBGPlugin
          api-version: '1.21'
          author: WynBG
          description: Pre-match briefing queue and Solo/Squad parachute deployment for Battleground.
          commands:
            wynbg:
              description: Kontrol utama plugin WynBG Battleground Drop
              usage: /wynbg <start|setqueue|setbriefing|setcenter|reload>
              permission: wynbg.admin
          EOF

          cat << 'EOF' > src/main/resources/config.yml
          locations:
            queue:
              world: "world"
              x: 0.5
              y: 100.0
              z: 0.5
              yaw: 0.0
              pitch: 0.0
            briefing:
              world: "world"
              x: 10.5
              y: 100.0
              z: 10.5
              yaw: 0.0
              pitch: 0.0
            arena-center:
              world: "world"
              x: 0.5
              y: 80.0
              z: 0.5

          briefing:
            orbit-radius: 3.8
            display-items:
              - TOTEM_OF_UNDYING
              - CROSSBOW
              - GOLDEN_APPLE
              - NETHERITE_SWORD
            slides:
              - delay-seconds: 0
                title: "<gold><bold>WYNBG"
                subtitle: "<gray>Jadilah pemain atau squad terakhir yang bertahan"
                sound: "BLOCK_BEACON_ACTIVATE"
                pitch: 0.8
              - delay-seconds: 3
                title: "<yellow><bold>KUMPULKAN LOOT"
                subtitle: "<gray>Cari senjata, armor, dan waspadai zona menyusut"
                sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
                pitch: 1.0
              - delay-seconds: 6
                title: "<red><bold>BERSIAP TERJUN"
                subtitle: "<white>Pintu pesawat terbuka dalam <yellow>3..."
                sound: "BLOCK_NOTE_BLOCK_PLING"
                pitch: 1.0
              - delay-seconds: 7
                title: "<red><bold>2..."
                subtitle: "<white>Periksa parasutmu!"
                sound: "BLOCK_NOTE_BLOCK_PLING"
                pitch: 1.2
              - delay-seconds: 8
                title: "<red><bold>1..."
                subtitle: "<white>MELUNCUR!"
                sound: "BLOCK_NOTE_BLOCK_PLING"
                pitch: 1.5
            deploy-at-seconds: 9

          deployment:
            squad-size: 4
            squad-formation-radius: 4.5
            spread-radius: 250
            min-spread-distance: 35
            drop-height-offset: 120
            lock-parachute-until-land: true
          EOF

          gradle build

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WynBG-Plugin
          path: "**/build/libs/*.jar"
