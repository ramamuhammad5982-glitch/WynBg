name: Build WynBG Jar

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Plugin
        run: |
          if [ -f "WynBG-1.21.1.zip" ]; then
            unzip -o WynBG-1.21.1.zip -d extracted_wynbg
          fi
          BUILD_FILE=$(find . -maxdepth 4 -name "build.gradle" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "File build.gradle tidak ditemukan di repositori!"
            exit 1
          fi
          BUILD_DIR=$(dirname "$BUILD_FILE")
          echo "Menjalankan Gradle di folder: $BUILD_DIR"
          cd "$BUILD_DIR"
          gradle build

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WynBG-Plugin
          path: "**/build/libs/*.jar"
